name: Release plugin

# Tag `<slug>-v<version>` and this builds that plugin's ZIP and publishes it as
# a release asset. Sites running the plugin pick the update up from there.
#
#   git tag dos-toolkit-v0.1.0 && git push origin dos-toolkit-v0.1.0
#
# Or, without a terminal: Actions -> Release plugin -> Run workflow, with the
# plugin's slug and version. That runs the same checks against the head of
# main and creates the tag itself when it publishes.

on:
  push:
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Plugin folder under plugins/, e.g. dos-outdoor-seating'
        required: true
        type: string
      version:
        description: 'Version to release, matching the plugin header, e.g. 0.6.4'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Full history and tags: the release notes below are bounded by this
      # plugin's previous tag, which a shallow clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve plugin and version from the tag
        id: meta
        env:
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # A manual run releases what is on main, never another branch.
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::Run this from main, not ${GITHUB_REF}"
              exit 1
            fi
            SLUG="${INPUT_SLUG}"
            VERSION="${INPUT_VERSION}"
            TAG="${SLUG}-v${VERSION}"
            if ! printf '%s' "$SLUG" | grep -Eq '^[a-z0-9-]+$' || ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
              echo "::error::Slug must be lowercase letters, digits and hyphens; version must be numbers and dots"
              exit 1
            fi
            # Never reuse a version: an existing tag means it already shipped.
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "::error::Tag ${TAG} already exists. Bump the version instead."
              exit 1
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            SLUG="${TAG%-v*}"
            VERSION="${TAG##*-v}"
          fi

          if [ ! -f "plugins/${SLUG}/${SLUG}.php" ]; then
            echo "::error::No plugin at plugins/${SLUG}/${SLUG}.php for tag ${TAG}"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check the plugin header matches the tag
        run: |
          set -euo pipefail
          SLUG="${{ steps.meta.outputs.slug }}"
          VERSION="${{ steps.meta.outputs.version }}"

          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' "plugins/${SLUG}/${SLUG}.php" | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')

          if [ "$HEADER" != "$VERSION" ]; then
            echo "::error::Tag says ${VERSION}, plugin header says ${HEADER}. Bump the header before tagging."
            exit 1
          fi

      - name: Check the version constant matches the tag
        run: |
          set -euo pipefail
          SLUG="${{ steps.meta.outputs.slug }}"
          VERSION="${{ steps.meta.outputs.version }}"

          # The header is what WordPress reads; the constant is what the plugin
          # and its updater compare against. If they disagree the site is told
          # about an update it already has, or never told about one. Not every
          # plugin has the constant, so its absence is fine.
          CONST=$(grep -m1 -E "define\([[:space:]]*'[A-Za-z0-9_]*_VERSION'[[:space:]]*," "plugins/${SLUG}/${SLUG}.php" | sed -E "s/.*,[[:space:]]*'([^']*)'.*/\1/" || true)

          if [ -n "$CONST" ] && [ "$CONST" != "$VERSION" ]; then
            echo "::error::Tag says ${VERSION}, the version constant says ${CONST}. Bump the constant before tagging."
            exit 1
          fi

      - name: Lint PHP
        run: |
          set -euo pipefail
          SLUG="${{ steps.meta.outputs.slug }}"
          find "plugins/${SLUG}" -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: |
          set -euo pipefail
          for t in tests/test-*.php; do
            echo "### $t"
            php "$t"
          done

      - name: Build the ZIP
        run: |
          set -euo pipefail
          SLUG="${{ steps.meta.outputs.slug }}"

          # WordPress installs the ZIP's top-level folder as the plugin
          # directory, so it has to be the slug and nothing else.
          mkdir -p build
          cp -R "plugins/${SLUG}" "build/${SLUG}"
          find build -name '.DS_Store' -delete
          ( cd build && zip -rq "../${SLUG}.zip" "${SLUG}" )
          unzip -l "${SLUG}.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SLUG="${{ steps.meta.outputs.slug }}"
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"

          # The repository holds several plugins, so GitHub's default notes
          # (everything since the previous release of any kind) would list
          # other plugins' commits. Start from this plugin's previous tag.
          PREVIOUS=$(git tag -l "${SLUG}-v*" --sort=-v:refname | grep -vxF "${TAG}" | head -n1 || true)

          NOTES_ARGS=()
          if [ -n "$PREVIOUS" ]; then
            NOTES_ARGS=(--notes-start-tag "$PREVIOUS")
          fi

          # --target only matters for a manual run, where the tag does not
          # exist yet: gh creates it on the commit that was just checked.
          gh release create "${TAG}" "${SLUG}.zip" \
            --target "${GITHUB_SHA}" \
            --title "${SLUG} ${VERSION}" \
            --generate-notes \
            "${NOTES_ARGS[@]}"
