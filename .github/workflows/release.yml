name: Release plugin

# Tag `<slug>-v<version>` and this builds that plugin's ZIP and publishes it as
# a release asset. Sites running the plugin pick the update up from there.
#
#   git tag dos-toolkit-v0.1.0 && git push origin dos-toolkit-v0.1.0

on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Full history and tags: the release notes below are bounded by this
      # plugin's previous tag, which a shallow clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve plugin and version from the tag
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SLUG="${TAG%-v*}"
          VERSION="${TAG##*-v}"

          if [ ! -f "plugins/${SLUG}/${SLUG}.php" ]; then
            echo "::error::No plugin at plugins/${SLUG}/${SLUG}.php for tag ${TAG}"
            exit 1
          fi

          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check the plugin header matches the tag
        run: |
          set -euo pipefail
          SLUG="${{ steps.meta.outputs.slug }}"
          VERSION="${{ steps.meta.outputs.version }}"

          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' "plugins/${SLUG}/${SLUG}.php" | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')

          if [ "$HEADER" != "$VERSION" ]; then
            echo "::error::Tag says ${VERSION}, plugin header says ${HEADER}. Bump the header before tagging."
            exit 1
          fi

      - name: Check the version constant matches the tag
        run: |
          set -euo pipefail
          SLUG="${{ steps.meta.outputs.slug }}"
          VERSION="${{ steps.meta.outputs.version }}"

          # The header is what WordPress reads; the constant is what the plugin
          # and its updater compare against. If they disagree the site is told
          # about an update it already has, or never told about one. Not every
          # plugin has the constant, so its absence is fine.
          CONST=$(grep -m1 -E "define\([[:space:]]*'[A-Za-z0-9_]*_VERSION'[[:space:]]*," "plugins/${SLUG}/${SLUG}.php" | sed -E "s/.*,[[:space:]]*'([^']*)'.*/\1/" || true)

          if [ -n "$CONST" ] && [ "$CONST" != "$VERSION" ]; then
            echo "::error::Tag says ${VERSION}, the version constant says ${CONST}. Bump the constant before tagging."
            exit 1
          fi

      - name: Lint PHP
        run: |
          set -euo pipefail
          SLUG="${{ steps.meta.outputs.slug }}"
          find "plugins/${SLUG}" -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: |
          set -euo pipefail
          for t in tests/test-*.php; do
            echo "### $t"
            php "$t"
          done

      - name: Build the ZIP
        run: |
          set -euo pipefail
          SLUG="${{ steps.meta.outputs.slug }}"

          # WordPress installs the ZIP's top-level folder as the plugin
          # directory, so it has to be the slug and nothing else.
          mkdir -p build
          cp -R "plugins/${SLUG}" "build/${SLUG}"
          find build -name '.DS_Store' -delete
          ( cd build && zip -rq "../${SLUG}.zip" "${SLUG}" )
          unzip -l "${SLUG}.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SLUG="${{ steps.meta.outputs.slug }}"
          VERSION="${{ steps.meta.outputs.version }}"

          # The repository holds several plugins, so GitHub's default notes
          # (everything since the previous release of any kind) would list
          # other plugins' commits. Start from this plugin's previous tag.
          PREVIOUS=$(git tag -l "${SLUG}-v*" --sort=-v:refname | grep -vxF "${GITHUB_REF_NAME}" | head -n1 || true)

          NOTES_ARGS=()
          if [ -n "$PREVIOUS" ]; then
            NOTES_ARGS=(--notes-start-tag "$PREVIOUS")
          fi

          gh release create "${GITHUB_REF_NAME}" "${SLUG}.zip" \
            --title "${SLUG} ${VERSION}" \
            --generate-notes \
            "${NOTES_ARGS[@]}"
